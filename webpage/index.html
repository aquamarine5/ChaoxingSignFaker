<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChaoxingSignFaker</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        #button {
            width: 100px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            background-color: #007bff;
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div id="info"></div>
    <div onclick="download()" id="button">下载</div>

    <script>
        const CDN_BASE = 'https://cdn2.aquamarine5.fun';
        const LEGACY_QINIU_HOST = 'cdn.aquamarine5.fun';
        const CONFIG_URL = CDN_BASE + '/chaoxingsignfaker_stackbricks_manifest.json';

        document.addEventListener('DOMContentLoaded', function () {
            if (window.location.href.indexOf("phone") > 0) {
                document.getElementById('info').innerText = '请使用 随地大小签APP（ChaoxingSignFaker） 扫码。';

            }
            var myTimeout = setTimeout(function () {
                download();
            }, 1000);

            const here = new URL(window.location.href);
            window.location.href = "cxsignfaker://import" + here.pathname + here.search;
        });

        function pickDownloadEntry(latest) {
            if (!latest) {
                return null;
            }
            if (latest.possibleDownloadPath && latest.possibleDownloadPath.length) {
                return latest.possibleDownloadPath.find(
                    function (path) { return path.authority.endsWith('.cloudflare'); }
                ) || latest.possibleDownloadPath[0];
            }
            if (latest.downloadUrl) {
                return {
                    filename: latest.downloadUrl,
                    authority: 'org.aquamarine5.brainspark.stackbricks.downloadpath.qiniu',
                    additionalInformation: { host: LEGACY_QINIU_HOST, isHttps: false }
                };
            }
            return null;
        }

        function resolveEntryUrl(entry) {
            const additional = entry.additionalInformation || {};
            const filename = entry.filename || entry.additionalInformation.filename;
            if (entry.authority && entry.authority.endsWith('.qiniu')) {
                const scheme = additional.isHttps === true ? 'https' : 'http';
                return scheme + '://' + (additional.host || LEGACY_QINIU_HOST) + '/' + filename;
            }
            const base = (additional.baseUrl || CDN_BASE).replace(/\/+$/, '');
            return base + '/' + filename;
        }

        // 首先获取配置文件
        function download() {
            fetch(CONFIG_URL)
                .then(response => {
                    if (!response.ok) {
                        console.error('获取配置文件失败');
                        return;
                    }
                    return response.json();
                })
                .then(config => {
                    const entry = pickDownloadEntry(config && config.latestStable);
                    if (!entry) {
                        console.error('配置文件格式无效');
                        return;
                    }

                    window.location.href = resolveEntryUrl(entry);
                })
        }
    </script>
</body>

</html>
